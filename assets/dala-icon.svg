<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Moon glow -->
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF8DC"/>
      <stop offset="70%" stop-color="#FFE4A0"/>
      <stop offset="100%" stop-color="#F5C842"/>
    </radialGradient>
    <!-- Shadow gradient for rabbits -->
    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4A030" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#C8941E" stop-opacity="0.6"/>
    </radialGradient>
  </defs>

  <!-- Night sky background (transparent for icon use) -->

  <!-- Full moon -->
  <circle cx="256" cy="256" r="230" fill="url(#moonGlow)" stroke="#E8B830" stroke-width="3"/>

  <!-- Moon craters (subtle) -->
  <circle cx="180" cy="160" r="25" fill="#EDD98A" opacity="0.4"/>
  <circle cx="340" cy="200" r="18" fill="#EDD98A" opacity="0.3"/>
  <circle cx="200" cy="340" r="20" fill="#EDD98A" opacity="0.35"/>
  <circle cx="310" cy="320" r="12" fill="#EDD98A" opacity="0.25"/>
  <circle cx="150" cy="260" r="15" fill="#EDD98A" opacity="0.3"/>

  <!-- Mortar (절구) - center bottom -->
  <ellipse cx="256" cy="340" rx="50" ry="20" fill="#8B6914" opacity="0.7"/>
  <path d="M206 340 L216 280 L296 280 L306 340 Z" fill="#A07818" opacity="0.65"/>
  <ellipse cx="256" cy="280" rx="40" ry="15" fill="#B8892A" opacity="0.6"/>

  <!-- Pestle (절구공이) - diagonal -->
  <line x1="230" y1="230" x2="285" y2="310" stroke="#8B6914" stroke-width="8" stroke-linecap="round" opacity="0.65"/>
  <circle cx="228" cy="228" r="8" fill="#8B6914" opacity="0.65"/>

  <!-- Left rabbit silhouette -->
  <g fill="#C8941E" opacity="0.6" transform="translate(-30, -10)">
    <!-- Body -->
    <ellipse cx="210" cy="300" rx="30" ry="25"/>
    <!-- Head -->
    <circle cx="200" cy="265" r="18"/>
    <!-- Left ear -->
    <ellipse cx="188" cy="228" rx="6" ry="22" transform="rotate(-15 188 228)"/>
    <!-- Right ear -->
    <ellipse cx="205" cy="225" rx="6" ry="24" transform="rotate(5 205 225)"/>
    <!-- Front arm (reaching to pestle) -->
    <ellipse cx="230" cy="285" rx="18" ry="7" transform="rotate(-30 230 285)"/>
    <!-- Back leg -->
    <ellipse cx="190" cy="318" rx="12" ry="8"/>
    <!-- Tail -->
    <circle cx="240" cy="305" r="6"/>
  </g>

  <!-- Right rabbit silhouette -->
  <g fill="#C8941E" opacity="0.6" transform="translate(30, -10)">
    <!-- Body -->
    <ellipse cx="302" cy="300" rx="30" ry="25"/>
    <!-- Head -->
    <circle cx="312" cy="265" r="18"/>
    <!-- Left ear -->
    <ellipse cx="305" cy="225" rx="6" ry="24" transform="rotate(-5 305 225)"/>
    <!-- Right ear -->
    <ellipse cx="322" cy="228" rx="6" ry="22" transform="rotate(15 322 228)"/>
    <!-- Front arm (reaching to pestle) -->
    <ellipse cx="282" cy="285" rx="18" ry="7" transform="rotate(30 282 285)"/>
    <!-- Back leg -->
    <ellipse cx="322" cy="318" rx="12" ry="8"/>
    <!-- Tail -->
    <circle cx="272" cy="305" r="6"/>
  </g>

  <!-- "DALA" text at bottom -->
  <text x="256" y="460" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="52" fill="#F5C842" letter-spacing="8">DALA</text>
  <text x="256" y="490" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#E8B830" letter-spacing="2">달아</text>
</svg>
