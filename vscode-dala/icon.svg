<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="moon" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFD633"/>
      <stop offset="70%" stop-color="#F5B800"/>
      <stop offset="100%" stop-color="#E09800"/>
    </radialGradient>
  </defs>

  <!-- Golden moon -->
  <circle cx="256" cy="256" r="240" fill="url(#moon)"/>

  <!-- All silhouettes -->
  <g fill="#1A1A1A">

    <!-- ===== Left rabbit ===== -->
    <!-- Left ear - tall, slightly outward -->
    <path d="M138 245 Q130 195 125 160 Q122 140 130 135 Q140 132 144 150 Q150 180 155 220 Q153 240 142 248Z"/>
    <!-- Right ear - tall, slightly inward -->
    <path d="M158 240 Q155 190 155 155 Q154 135 162 130 Q172 128 174 148 Q175 178 172 218 Q168 238 160 242Z"/>

    <!-- Head - round -->
    <circle cx="152" cy="270" r="30"/>

    <!-- Body - sitting posture, chubby -->
