    <!-- Ears -->
    <path d="M175 200 Q168 150 172 110 Q175 90 185 88 Q196 90 194 112 Q190 150 188 195Z"/>
    <path d="M200 190 Q202 140 210 105 Q215 85 225 87 Q234 92 228 115 Q218 148 208 190Z"/>

