    <!-- Mortar bowl -->
    <path d="M280 350 Q285 310 330 300 Q375 310 380 350 Q375 375 330 380 Q285 375 280 350Z"/>
    <!-- Mortar rim -->
    <ellipse cx="330" cy="304" rx="50" ry="16"/>
    <!-- Mortar base -->
