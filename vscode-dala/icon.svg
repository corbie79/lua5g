<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Yellow circle background -->
  <circle cx="256" cy="256" r="240" fill="#FFC800"/>

  <!-- Rabbit + mortar silhouette -->
