    <!-- Front arm raised holding pestle -->
    <path d="M180 300 Q195 280 220 260 Q230 255 232 265 Q225 275 205 292 Q190 308 182 315Z"/>

    <!-- Back arm -->
    <path d="M130 310 Q120 325 118 340 Q118 348 125 345 Q132 335 138 320Z"/>

    <!-- Foot -->
    <ellipse cx="142" cy="388" rx="22" ry="10" />
    <ellipse cx="182" cy="385" rx="18" ry="9" />

    <!-- Tail - fluffy round -->
    <circle cx="200" cy="360" r="14"/>

    <!-- ===== Right rabbit ===== -->
    <!-- Left ear -->
    <path d="M354 240 Q357 190 357 155 Q358 135 350 130 Q340 128 338 148 Q337 178 340 218 Q344 238 352 242Z"/>
    <!-- Right ear -->
    <path d="M374 245 Q382 195 387 160 Q390 140 382 135 Q372 132 368 150 Q362 180 357 220 Q359 240 370 248Z"/>

    <!-- Head -->
    <circle cx="360" cy="270" r="30"/>

    <!-- Body -->
    <ellipse cx="352" cy="345" rx="42" ry="45"/>

    <!-- Front arm raised holding pestle -->
    <path d="M332 300 Q317 280 292 260 Q282 255 280 265 Q287 275 307 292 Q322 308 330 315Z"/>

    <!-- Back arm -->
    <path d="M382 310 Q392 325 394 340 Q394 348 387 345 Q380 335 374 320Z"/>

    <!-- Foot -->
    <ellipse cx="370" cy="388" rx="22" ry="10"/>
    <ellipse cx="330" cy="385" rx="18" ry="9"/>

    <!-- Tail -->
    <circle cx="312" cy="360" r="14"/>

    <!-- ===== Mortar (절구) ===== -->
    <!-- Bowl -->
    <path d="M215 380 Q218 340 256 330 Q294 340 297 380 Q294 398 256 402 Q218 398 215 380Z"/>
    <!-- Rim -->
    <ellipse cx="256" cy="334" rx="44" ry="14"/>
    <!-- Base -->
    <ellipse cx="256" cy="400" rx="30" ry="8"/>

    <!-- ===== Pestle (절구공이) ===== -->
    <rect x="250" y="215" width="12" height="125" rx="6" transform="rotate(-3 256 278)"/>
    <!-- Pestle head -->
    <ellipse cx="253" cy="213" rx="16" ry="11" transform="rotate(-3 253 213)"/>

  </g>
</svg>
